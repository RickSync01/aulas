<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações ao Clicar</title>
    <style>
        /* Estilo da palavra clicável */
        .palavra-clicavel {
            color: #007BFF;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
        }

        /* Estilo do fundo escuro (Modal) - Escondido por padrão */
        .janela-modal {
            display: none; 
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Fundo semi-transparente */
        }

        /* Estilo do quadro de informações */
        .conteudo-modal {
            background-color: #ffffff;
            margin: 15% auto;
            padding: 20px;
            border-radius: 8px;
            width: 50%;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* Botão de fechar (X) */
        .botao-fechar {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .botao-fechar:hover {
            color: #000;
        }
    </style>
</head>
<body>

    <p>O desenvolvimento web moderno utiliza <span class="palavra-clicavel" id="gatilho-modal">JavaScript</span> para criar interatividade nas páginas.</p>

    <!-- Quadro de Informações (Modal) -->
    <div id="meu-modal" class="janela-modal">
        <div class="conteudo-modal">
            <span class="botao-fechar" id="fechar-modal">&times;</span>
            <h3>JavaScript</h3>
            <p>JavaScript é uma linguagem de programação que permite implementar itens complexos em páginas web, trazendo vida e interatividade a elas.</p>
        </div>
    </div>

    <script>
        // Seleciona os elementos do DOM
        const palavra = document.getElementById('gatilho-modal');
        const modal = document.getElementById('meu-modal');
        const botaoFechar = document.getElementById('fechar-modal');

        // Abre o quadro ao clicar na palavra
        palavra.addEventListener('click', () => {
            modal.style.display = 'block';
        });

        // Fecha o quadro ao clicar no botão de fechar (X)
        botaoFechar.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        // Fecha o quadro se o usuário clicar em qualquer lugar fora dele
        window.addEventListener('click', (event) => {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>

</body>
</html>
